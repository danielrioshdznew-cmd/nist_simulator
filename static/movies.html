<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIST Failure Movies</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#15171c; --panel:#1f232b; --line:#2e333d; --text:#dfe3ea; --dim:#8b93a3; --acc:#5aa7ff; --bad:#ff4d4d; --ok:#4cc38a; --warn:#e6b450; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  #bar h1 { font-size:15px; margin:0 8px 0 0; }
  #bar a { color:var(--acc); }
  select, button, input { background:#14171d; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 7px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); } button.on { background:var(--acc); color:#08111f; border-color:var(--acc); }
  #scrub { width:220px; }
  .dim { color:var(--dim); }
  #grid { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; padding:8px; }
  .tile { display:flex; flex-direction:column; background:var(--panel); border:2px solid var(--line); border-radius:8px; overflow:hidden; min-height:0; }
  .tile.failnow { border-color:var(--bad); box-shadow:0 0 0 3px #ff4d4d55; }
  .tile.failed { border-color:#7a2a2a; }
  .tile.fixed { border-color:var(--ok); }
  .badge { position:absolute; right:8px; top:6px; background:var(--ok); color:#06210f; font-weight:700; padding:3px 8px; border-radius:5px; display:none; pointer-events:none; }
  .verdict.ok { color:var(--ok); font-weight:650; } .verdict.bad { color:var(--bad); font-weight:650; }
  .head { padding:6px 9px 4px; border-bottom:1px solid var(--line); }
  .name { font-weight:650; font-size:13.5px; } .name .num { color:var(--warn); margin-right:6px; }
  .sub { color:var(--dim); font-size:12px; }
  .view { position:relative; flex:1; min-height:120px; }
  .view canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud { position:absolute; left:8px; top:6px; background:#000a; padding:3px 7px; border-radius:5px; font-variant-numeric:tabular-nums; font-size:12px; pointer-events:none; }
  .flash { position:absolute; right:8px; top:6px; background:var(--bad); color:#fff; font-weight:700; padding:3px 8px; border-radius:5px; display:none; pointer-events:none; }
  .ended { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); background:#000c; color:#fff; font-weight:650;
           padding:4px 10px; border-radius:5px; display:none; pointer-events:none; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); background:#15171ccc; }
  .foot { padding:5px 9px 7px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:flex-start; }
  .foot textarea { flex:1; height:42px; resize:vertical; background:#14171d; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 6px; font:inherit; }
  .foot .side { display:flex; flex-direction:column; gap:3px; font-size:12px; white-space:nowrap; }
  .foot a { color:var(--acc); }
  .why { font-size:12px; color:var(--dim); max-height:3.0em; overflow:hidden; cursor:pointer; padding:0 9px 3px; }
  .why.open { max-height:none; color:var(--text); }
  .saved { color:var(--ok); font-size:11.5px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="bar">
  <h1>Failure movies</h1>
  <select id="cat"></select>
  policy <select id="policy"></select>
  <button id="cmp" title="each case twice: c053 on the left, the chosen policy on the right">⇆ Compare with c053</button>
  <button id="prev">◀ Prev 4</button><span id="page" class="dim"></span><button id="next">Next 4 ▶</button>
  <button id="play" class="on">❚❚ Pause</button>
  speed <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
  <select id="win"><option value="fail">around the failure (3 s before → 3 s after)</option><option value="full">whole episode (start → end)</option></select>
  <input id="scrub" type="range" min="0" max="99" value="0"> <span id="frame" class="dim"></span>

  <span style="flex:1"></span><a href="index.html">Lab</a> <a href="dashboard.html">Dashboard</a>
</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const PEG_COLORS = ['#ff7a59', '#ffd166', '#06d6a0', '#4cc9f0', '#b388ff', '#f472b6', '#a3e635', '#f59e0b'];
const HAND = new Set(['hand', 'fl', 'fr']);
async function api(cmd, args = {}) {
  const r = await fetch('/api', { method: 'POST', body: JSON.stringify({ cmd, ...args }) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
const b64f = (s) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Float32Array(u.buffer); };
function setM(m, f, o) { m.matrix.set(f[o + 3], f[o + 4], f[o + 5], f[o], f[o + 6], f[o + 7], f[o + 8], f[o + 1], f[o + 9], f[o + 10], f[o + 11], f[o + 2], 0, 0, 0, 1); }
function geomMesh(g) {
  const [a, b, c] = g.size; let geo = null;
  if (g.type === 'box') geo = new THREE.BoxGeometry(2 * a, 2 * b, 2 * c);
  else if (g.type === 'cylinder') geo = new THREE.CylinderGeometry(a, a, 2 * b, 32).rotateX(Math.PI / 2);
  else if (g.type === 'capsule') geo = new THREE.CapsuleGeometry(a, 2 * b, 8, 16).rotateX(Math.PI / 2);
  else if (g.type === 'sphere') geo = new THREE.SphereGeometry(a, 20, 14);
  else if (g.type === 'plane') geo = new THREE.PlaneGeometry(a > 0 ? 2 * a : 0.8, b > 0 ? 2 * b : 0.8);
  if (!geo) return null;
  let color = new THREE.Color(g.rgba[0], g.rgba[1], g.rgba[2]);
  const pm = /^peg(\d+)$/.exec(g.body);
  if (pm) color = new THREE.Color(PEG_COLORS[+pm[1] % 8]);
  else if (HAND.has(g.body)) color = new THREE.Color(g.name.startsWith('pad') ? '#e0e0e0' : '#6b7280');
  else if (/^clutter/.test(g.body)) color = new THREE.Color('#5b7db1');
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, transparent: HAND.has(g.body), opacity: HAND.has(g.body) ? 0.55 : g.rgba[3] });
  const m = new THREE.Mesh(geo, mat); m.matrixAutoUpdate = false; if (g.rgba[3] === 0) m.visible = false; return m;
}

// ---------- tiles ----------
const tiles = [];
for (let t = 0; t < 4; t++) {
  const el = document.createElement('div'); el.className = 'tile';
  el.innerHTML = `<div class="head"><div class="name"></div><div class="sub"></div></div><div class="why" title="click to expand"></div>
    <div class="view"><div class="hud"></div><div class="flash">FAILS NOW</div><div class="badge">FIXED</div><div class="ended"></div><div class="loading">simulating…</div></div>
    <div class="foot"><textarea placeholder="Why does it fail, and how would you fix it? (saved for Claude)"></textarea>
      <div class="side"><a class="lab" target="_blank">open in lab ↗</a><span class="saved"></span></div></div>`;
  $('grid').append(el);
  const view = el.querySelector('.view');
  const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio);
  view.prepend(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#15171c');
  scene.add(new THREE.HemisphereLight(0xffffff, 0x30343c, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(0.3, -0.5, 1.0); scene.add(sun);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.002, 10); camera.up.set(0, 0, 1);
  const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
  const world = new THREE.Group(), marks = new THREE.Group(); scene.add(world, marks);
  const top = (m) => { m.material.depthTest = false; m.material.transparent = true; m.renderOrder = 999; marks.add(m); return m; };
  const ring = top(new THREE.Mesh(new THREE.TorusGeometry(1, 0.08, 8, 48), new THREE.MeshBasicMaterial({ color: 0xff3b3b })));
  const cone = top(new THREE.Mesh(new THREE.ConeGeometry(0.005, 0.014, 16), new THREE.MeshBasicMaterial({ color: 0xff3b3b })));
  cone.rotation.x = -Math.PI / 2;
  const ta = el.querySelector('textarea'); let saveT = null;
  ta.addEventListener('input', () => { clearTimeout(saveT); saveT = setTimeout(() => saveNote(tiles[t]), 600); });
  el.querySelector('.why').onclick = (e) => e.currentTarget.classList.toggle('open');
  tiles.push({ el, view, renderer, scene, camera, controls, world, ring, cone, ta, clip: null, meshes: [], frames: null });
}
function resize() { tiles.forEach((T) => { const w = T.view.clientWidth, h = T.view.clientHeight; T.renderer.setSize(w, h, false); T.camera.aspect = w / Math.max(1, h); T.camera.updateProjectionMatrix(); }); }
addEventListener('resize', resize);

function loadTile(T, clip) {
  T.clip = clip; T.world.clear(); T.el.classList.remove('failnow', 'failed', 'fixed');
  const c = clip.case;
  // the case = a peg c053 did not get seated; each tile marks ITS OWN policy's result (c053 = the census, others = their own run)
  const own = clip.own || { fixed: false, fail_step: c.fail_step, why: clip.label };
  const base = clip.policy === 'c053';
  T.own = own;
  T.el.classList.toggle('fixed', !!own.fixed);
  T.el.querySelector('.name').innerHTML = `<span class="num">#${c.id}</span>${clip.label} <span class="dim" style="font-weight:400">· ${clip.policy}</span>`;
  const c053txt = c.fail_step !== null ? `c053 fails at step ${c.fail_step}` : `c053: episode ${c.terminal}`;
  const verdict = base ? '' : own.fixed ? ` · <span class="verdict ok">this policy: FIXED, peg ${c.peg} seated at step ${own.seated_step}</span>`
    : ` · <span class="verdict bad">this policy: still fails at step ${own.fail_step} (${own.why})</span>`;
  T.el.querySelector('.sub').innerHTML = `board ${c.seed}/${c.episode} · peg ${c.peg} · ${c.shape} ${c.dia_mm} mm · start ${c.start} · ${c053txt}${verdict}`;
  T.el.querySelector('.why').textContent = (base ? '' : 'Under c053: ') + c.why;
  T.el.querySelector('.lab').href = `index.html?case=${c.id}&policy=${clip.policy}`;
  T.ta.value = notes[String(c.id)] ? notes[String(c.id)].text : '';
  T.el.querySelector('.saved').textContent = notes[String(c.id)] ? 'saved' : '';
  T.meshes = clip.scene.geoms.map((g) => { const m = geomMesh(g); if (m) T.world.add(m); return m; });
  const st = clip.static ? b64f(clip.static) : null;
  if (st) T.meshes.forEach((m, g) => m && setM(m, st, g * 12));
  T.frames = clip.frames ? b64f(clip.frames) : null;
  T.n = clip.steps.length;
  T.failIdx = -1;
  if (own.fail_step !== null && own.fail_step !== undefined && T.n) {   // this policy's failure frame (or the last frame)
    const k = clip.steps.findIndex((s) => s >= own.fail_step);
    T.failIdx = k >= 0 ? k : (own.fail_step > clip.steps[T.n - 1] ? T.n - 1 : -1);
  }
  const p0 = clip.pos[Math.max(0, T.failIdx)] || clip.pos[0] || [clip.scene.board_xy[0], clip.scene.board_xy[1], 0.03];
  T.controls.target.set(p0[0], p0[1], Math.max(0.03, p0[2]));
  T.camera.position.set(p0[0] + 0.07, p0[1] - 0.2, p0[2] + 0.15);
  T.ring.scale.setScalar(c.dia_mm / 1000 + 0.004);
  T.el.querySelector('.loading').style.display = 'none';
}
function showFrame(T, f) {
  const clip = T.clip; if (!clip || !T.frames || !T.n) return;
  const i = Math.min(f, T.n - 1), nd = clip.dyn.length;
  clip.dyn.forEach((g, k) => { const m = T.meshes[g]; if (m) setM(m, T.frames, (i * nd + k) * 12); });
  const p = clip.pos[i]; T.ring.position.set(p[0], p[1], p[2]); T.cone.position.set(p[0], p[1], p[2] + 0.045);
  const az = clip.az[i];
  T.el.querySelector('.hud').innerHTML = `step ${clip.steps[i]} · ${clip.phases[i]} → peg ${clip.targets[i]} · failing peg upright ${az.toFixed(2)}${clip.touch[i] ? ' · ✋ hand touching it' : ''}`;
  const now = T.failIdx >= 0 && i >= T.failIdx && i < T.failIdx + 6;
  T.el.classList.toggle('failnow', now); T.el.classList.toggle('failed', T.failIdx >= 0 && i >= T.failIdx + 6);
  T.el.querySelector('.flash').style.display = now ? 'block' : 'none';
  T.el.querySelector('.badge').style.display = T.own && T.own.fixed ? 'block' : 'none';
  const endHere = i === T.n - 1 && clip.end !== 'running';      // the episode itself ended (e.g. part_lost): nothing after this
  const en = T.el.querySelector('.ended');
  en.style.display = endHere ? 'block' : 'none';
  const fin = clip.final ? ` · ${clip.final.seated}/${clip.final.k} pegs seated · score ${clip.final.score.toFixed(3)}` : '';
  const endTxt = { assembled: `ALL PEGS SEATED at step ${clip.steps[i]}`, time_limit: 'TIME LIMIT reached',
                   part_lost: 'EPISODE ENDED: a peg fell off the board' }[clip.end] || `EPISODE ENDED here (${clip.end})`;
  en.textContent = endHere ? endTxt + fin : '';
  en.style.background = endHere && clip.end === 'assembled' ? '#1f6f45' : '#000c';
}

// ---------- notes ----------
let notes = {};
async function saveNote(T) {
  if (!T.clip) return;
  const c = T.clip.case;
  const r = await api('note', { id: c.id, text: T.ta.value, case: { id: c.id, cat: c.cat, seed: c.seed, episode: c.episode, peg: c.peg, fail_step: c.fail_step } });
  notes = r.notes; T.el.querySelector('.saved').textContent = T.ta.value.trim() ? `saved · ${r.file}` : '';
}

// ---------- paging + playback ----------
let cases = [], page = 0, frame = 0, playing = true, maxN = 100, compare = new URLSearchParams(location.search).get('compare') === '1';
const fullQ = new URLSearchParams(location.search).get('full') === '1';
const per = () => (compare ? 2 : 4);
async function loadPage() {
  const n = per();
  const ids = cases.slice(page * n, page * n + n).map((c) => c.id);
  $('page').textContent = cases.length ? `cases ${page * n + 1}-${Math.min(cases.length, page * n + n)} of ${cases.length}` : 'no cases';
  const nt = compare ? ids.length * 2 : ids.length;
  tiles.forEach((T, i) => { T.el.style.visibility = i < nt ? 'visible' : 'hidden'; T.el.querySelector('.loading').style.display = 'flex'; });
  if (!ids.length) return;
  let clips;
  if (compare) {        // left column = c053 as scored, right column = the chosen policy, same case per row
    const [a, b] = await Promise.all([api('clips', { ids, before: 75, after: 75, full: $('win').value === 'full', policy: 'c053' }),
                                      api('clips', { ids, before: 75, after: 75, full: $('win').value === 'full', policy: $('policy').value || undefined })]);
    clips = []; ids.forEach((_, i) => { clips.push(a.clips[i], b.clips[i]); });
  } else {
    clips = (await api('clips', { ids, before: 75, after: 75, full: $('win').value === 'full', policy: $('policy').value || undefined })).clips;
  }
  clips.forEach((clip, i) => loadTile(tiles[i], clip));
  maxN = Math.max(...clips.map((c) => c.steps.length), 1);
  $('scrub').max = maxN - 1; frame = 0;
  $('next').textContent = `Next ${n} ▶`; $('prev').textContent = `◀ Prev ${n}`;
}
$('win').onchange = () => { $('speed').value = $('win').value === 'full' ? '4' : '1'; page = 0; loadPage(); };
$('cmp').onclick = () => { compare = !compare; $('cmp').classList.toggle('on', compare); page = 0; loadPage(); };
async function loadCat() {
  const r = await api('cases', { cause: $('cat').value });
  cases = r.cases.filter((c) => c.fail_step !== null).concat(r.cases.filter((c) => c.fail_step === null));
  page = 0; await loadPage();
}
$('cat').onchange = loadCat;
$('next').onclick = () => { if ((page + 1) * per() < cases.length) { page++; loadPage(); } };
$('prev').onclick = () => { if (page > 0) { page--; loadPage(); } };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '❚❚ Pause' : '▶ Play'; $('play').classList.toggle('on', playing); };
$('scrub').oninput = () => { frame = +$('scrub').value; playing = false; $('play').textContent = '▶ Play'; $('play').classList.remove('on'); };

let acc = 0, lastT = performance.now();
function loop(now) {
  const dt = (now - lastT) / 1000; lastT = now;
  if (playing) { acc += dt * 25 * +$('speed').value; while (acc >= 1) { acc -= 1; frame = (frame + 1) % maxN; } }
  $('scrub').value = frame; $('frame').textContent = `frame ${frame + 1}/${maxN}`;
  tiles.forEach((T) => { if (T.clip) showFrame(T, frame); T.controls.update(); T.renderer.render(T.scene, T.camera); });
  requestAnimationFrame(loop);
}

(async () => {
  resize();
  if (fullQ) { $('win').value = 'full'; $('speed').value = '4'; }
  notes = (await api('notes')).notes || {};
  const pl = await api('policies');
  const wantP = new URLSearchParams(location.search).get('policy');
  $('policy').innerHTML = pl.policies.map((n) => `<option value="${n}">${n === 'c053' ? 'c053 (as scored)' : n === 'c054_userfixes' ? 'c054 (your fixes)' : n}</option>`).join('');
  const newest = pl.policies.filter((p) => p !== 'c053').sort().pop();
  $('policy').value = wantP && pl.policies.includes(wantP) ? wantP : (compare && newest ? newest : pl.current);
  $('cmp').classList.toggle('on', compare);
  $('policy').onchange = () => loadPage();
  const s = await api('categories');
  const want = new URLSearchParams(location.search).get('cat');
  $('cat').innerHTML = `<option value="all">All failures (${s.total})</option>` + s.cats.map((c) => `<option value="${c.key}">${c.label} (${c.n})</option>`).join('');
  $('cat').value = want && s.cats.some((c) => c.key === want) ? want : 'tip_pick';
  requestAnimationFrame(loop);
  await loadCat();
  resize();
})();
</script>
</body>
</html>
