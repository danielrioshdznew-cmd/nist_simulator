<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#15171c; --panel:#1f232b; --line:#2e333d; --text:#dfe3ea; --dim:#8b93a3; --acc:#5aa7ff; --warn:#e6b450; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  #bar h1 { font-size:15px; margin:0 6px 0 0; }
  button, select { background:#14171d; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); } button.on { background:var(--acc); color:#08111f; border-color:var(--acc); }
  #cases { display:flex; flex-wrap:wrap; gap:5px; }
  #scrub { flex:1; min-width:160px; }
  .dim { color:var(--dim); }
  #info { padding:7px 12px; border-bottom:1px solid var(--line); }
  #info .t { font-weight:650; font-size:14px; } #info .t .num { color:var(--warn); margin-right:6px; }
  #info .note { color:var(--dim); margin-top:2px; max-height:4.4em; overflow:auto; }
  #view { position:relative; flex:1; min-height:0; }
  #view canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { position:absolute; left:10px; top:8px; background:#000a; padding:3px 8px; border-radius:5px; font-variant-numeric:tabular-nums; pointer-events:none; }
  #help { position:absolute; right:10px; bottom:8px; color:var(--dim); font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<div id="bar">
  <h1>__TITLE__</h1>
  <div id="cases"></div>
  <button id="play">▶ Play</button>
  <button id="replay">↻ From start</button>
  speed <select id="speed"><option value="0.5">½×</option><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select>
  <button id="mark" class="on" title="red ring on the peg to watch">marker</button>
  <input id="scrub" type="range" min="0" max="1" value="0">
</div>
<div id="info"><div class="t"></div><div class="sub dim"></div><div class="note"></div></div>
<div id="view"><div id="hud"></div><div id="help">drag: rotate · right-drag: move · wheel: zoom · space: play/pause · ← →: step</div></div>
<script type="importmap">{ "imports": { "three": "data:text/javascript;base64,__THREE_B64__", "three/orbit": "data:text/javascript;base64,__ORBIT_B64__" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/orbit';

const D = __DATA__;
const $ = (id) => document.getElementById(id);
const PEG_COLORS = ['#ff7a59', '#ffd166', '#06d6a0', '#4cc9f0', '#b388ff', '#f472b6', '#a3e635', '#f59e0b'];
const HAND = new Set(['hand', 'fl', 'fr']);
const i16 = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Int16Array(u.buffer); };

function geomMesh(g) {
  const [a, b, c] = g.size; let geo = null;
  if (g.type === 'box') geo = new THREE.BoxGeometry(2 * a, 2 * b, 2 * c);
  else if (g.type === 'cylinder') geo = new THREE.CylinderGeometry(a, a, 2 * b, 32).rotateX(Math.PI / 2);
  else if (g.type === 'capsule') geo = new THREE.CapsuleGeometry(a, 2 * b, 8, 16).rotateX(Math.PI / 2);
  else if (g.type === 'sphere') geo = new THREE.SphereGeometry(a, 20, 14);
  else if (g.type === 'plane') geo = new THREE.PlaneGeometry(a > 0 ? 2 * a : 0.8, b > 0 ? 2 * b : 0.8);
  if (!geo) return null;
  let color = new THREE.Color(g.rgba[0], g.rgba[1], g.rgba[2]);
  const pm = /^peg(\d+)$/.exec(g.body);
  if (pm) color = new THREE.Color(PEG_COLORS[+pm[1] % 8]);
  else if (HAND.has(g.body)) color = new THREE.Color(g.name.startsWith('pad') ? '#e0e0e0' : '#6b7280');
  else if (/^clutter/.test(g.body)) color = new THREE.Color('#5b7db1');
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, transparent: HAND.has(g.body), opacity: HAND.has(g.body) ? 0.55 : g.rgba[3] });
  const m = new THREE.Mesh(geo, mat); if (g.rgba[3] === 0) m.visible = false; return m;
}
function place(m, a, o) {       // a = int16 [x y z qx qy qz qw] per geom
  m.position.set(a[o] * D.pos_q, a[o + 1] * D.pos_q, a[o + 2] * D.pos_q);
  m.quaternion.set(a[o + 3] / 32767, a[o + 4] / 32767, a[o + 5] / 32767, a[o + 6] / 32767);
}

const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio);
view.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#15171c');
scene.add(new THREE.HemisphereLight(0xffffff, 0x30343c, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(0.3, -0.5, 1.0); scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, 1, 0.002, 10); camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
const world = new THREE.Group(), marks = new THREE.Group(); scene.add(world, marks);
const top = (m) => { m.material.depthTest = false; m.material.transparent = true; m.material.opacity = 0.85; m.renderOrder = 999; marks.add(m); return m; };
const ring = top(new THREE.Mesh(new THREE.TorusGeometry(1, 0.08, 8, 48), new THREE.MeshBasicMaterial({ color: 0xff3b3b })));
const cone = top(new THREE.Mesh(new THREE.ConeGeometry(0.005, 0.014, 16), new THREE.MeshBasicMaterial({ color: 0xff3b3b })));
cone.rotation.x = -Math.PI / 2;

let cur = null, frame = 0, playing = false, acc = 0;
function load(k) {
  const c = D.cases[k];
  world.clear();
  const st = i16(c.static);
  const meshes = c.geoms.map((g, j) => { const m = geomMesh(g); if (m) { place(m, st, j * 7); world.add(m); } return m; });
  cur = { c, meshes, fr: i16(c.frames), nd: c.dyn.length, n: c.steps.length };
  [...$('cases').children].forEach((b, j) => b.classList.toggle('on', j === k));
  $('info').querySelector('.t').innerHTML = `<span class="num">#${c.id}</span>watch peg ${c.peg} (${c.shape} ${c.dia} mm, red ring) · board ${c.board} · start '${c.start}'`;
  $('info').querySelector('.sub').textContent = `Why this board is here: c053 failed on that peg: ${c.c053.toLowerCase()}${c.c053_step !== null ? ` (step ${c.c053_step})` : ''}. Below: ${D.policy}, the whole episode.`;
  $('info').querySelector('.note').textContent = c.note ? `Your note: ${c.note}` : '';
  ring.scale.setScalar(c.dia / 1000 + 0.004);
  const [bx, by] = c.board_xy || [0, 0];
  controls.target.set(bx, by, 0.02); camera.position.set(bx + 0.02, by - 0.42, 0.36); controls.update();
  $('scrub').max = cur.n - 1; show(0); setPlay(true);
}
function show(f) {
  if (!cur) return;
  frame = Math.max(0, Math.min(f, cur.n - 1));
  const o = frame * cur.nd * 7;
  cur.c.dyn.forEach((g, j) => { const m = cur.meshes[g]; if (m) place(m, cur.fr, o + j * 7); });
  const p = cur.c.peg_pos[frame]; ring.position.set(p[0], p[1], p[2]); cone.position.set(p[0], p[1], p[2] + 0.045);
  $('scrub').value = frame;
  const s = cur.c.steps[frame];
  $('hud').textContent = `step ${s} / ${cur.c.steps[cur.n - 1]} · ${(s / 25).toFixed(1)} s`;
}
function setPlay(on) {
  if (on && cur && frame >= cur.n - 1) show(0);
  playing = on; $('play').textContent = on ? '❚❚ Pause' : '▶ Play'; $('play').classList.toggle('on', on);
}
D.cases.forEach((c, k) => { const b = document.createElement('button'); b.textContent = `#${c.id}`; b.onclick = () => load(k); $('cases').append(b); });
$('play').onclick = () => setPlay(!playing);
$('replay').onclick = () => { show(0); setPlay(true); };
$('mark').onclick = () => { marks.visible = !marks.visible; $('mark').classList.toggle('on', marks.visible); };
$('scrub').oninput = () => { setPlay(false); show(+$('scrub').value); };
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowRight') { setPlay(false); show(frame + 1); }
  else if (e.code === 'ArrowLeft') { setPlay(false); show(frame - 1); }
});
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing && cur) {
    acc += dt * 25 * +$('speed').value / D.step;          // frames are every D.step simulation steps (25 steps per second)
    let f = frame;
    while (acc >= 1) { acc -= 1; f += 1; }
    if (f >= cur.n - 1) { show(cur.n - 1); setPlay(false); acc = 0; }   // stop and stay on the last frame
    else if (f !== frame) show(f);
  }
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
load(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
